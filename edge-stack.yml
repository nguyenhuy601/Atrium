# Traefik edge — SoT for https://$DOMAIN and https://api.$DOMAIN
# Prerequisite: stop host Nginx on 80/443 (no dual-edge).
# Local TLS: mkcert → ./certs/cert.pem + ./certs/key.pem (see docs/edge-traefik-split-domain.md)
#
#   docker network create --driver overlay --attachable edge-public
#   docker stack deploy -c edge-stack.yml edge
#
# Prod LE: set TRAEFIK_ACME_EMAIL, uncomment certificatesresolvers + httpchallenge,
# and add tls.certresolver=le labels on web-client / api-gateway.

services:
  traefik:
    image: traefik:v3.3
    command:
      - --providers.swarm=true
      - --providers.swarm.endpoint=unix:///var/run/docker.sock
      - --providers.swarm.exposedbydefault=false
      - --providers.swarm.network=edge-public
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --api.dashboard=false
      - --log.level=INFO
      # Prod Let's Encrypt (uncomment + set email):
      # - --certificatesresolvers.le.acme.email=${TRAEFIK_ACME_EMAIL:-admin@example.com}
      # - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      # - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./certs:/certs:ro
      - traefik-certs:/letsencrypt
    networks:
      - edge-public
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 64M

volumes:
  traefik-certs:

networks:
  # Pre-create: docker network create --driver overlay --attachable edge-public
  edge-public:
    external: true
    name: edge-public
